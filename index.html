<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teste Unsoft</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topo shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <img src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo" class="logo" />
      <nav>
        <ul class="nav menu-topo">
          <li class="nav-item"><a href="#" class="nav-link">Comprar</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Alugar</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Sobre</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Anuncie seu imóvel</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Contato</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Área do Cliente</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="banner d-flex align-items-center justify-content-center">
    <div class="filtro-imoveis bg-white rounded p-4 shadow">
      <form class="row g-2 align-items-center">

        <div class="col-auto">
          <select class="form-select" aria-label="Comprar ou Alugar">
            <option selected>Comprar</option>
            <option>Alugar</option>
          </select>
        </div>

        <div class="col-auto">
          <select class="form-select" aria-label="Tipo de imóvel">
            <option selected>Todos</option>
            <option>Casa</option>
            <option>Apartamento</option>
            <option>Terreno</option>
          </select>
        </div>

        <div class="col-auto flex-grow-1">
          <input type="text" class="form-control" placeholder="Bairro ou Cidade" />
        </div>

        <div class="col-auto">
          <select class="form-select" aria-label="Quartos">
            <option selected>Quartos</option>
            <option>1</option>
            <option>2</option>
            <option>3+</option>
          </select>
        </div>

        <div class="col-auto minmax-inputs d-flex gap-2">
          <input type="number" class="form-control" placeholder="Min" />
          <input type="number" class="form-control" placeholder="Max" />
        </div>

        <div class="col-12 mt-3">
          <select class="form-select" aria-label="Outros filtros">
            <option selected>Todos</option>
            <option>Com piscina</option>
            <option>Com garagem</option>
          </select>
        </div>

        <div class="col-auto mt-3">
          <button type="button" class="btn btn-outline-secondary">Filtrar Código</button>
        </div>

        <div class="col-auto mt-3 flex-grow-1">
          <button type="submit" class="btn btn-success w-100">Buscar Imóveis</button>
        </div>

      </form>
    </div>
  </section>

  <!-- Seções de Carrossel com slick aqui (Super Destaque, Venda, Locação) -->
  <section class="py-5">
    <div class="container">
      <h3 class="mb-4">Super Destaque</h3>
      <div class="carousel-super">
        <div><img src="https://source.unsplash.com/600x400/?luxury-house" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?modern-house" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?apartment" alt="" /></div>
      </div>
    </div>
  </section>

  <section class="py-5 bg-light">
    <div class="container">
      <h3 class="mb-4">Destaque para Venda</h3>
      <div class="carousel-venda">
        <div><img src="https://source.unsplash.com/600x400/?house" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?apartment" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?real-estate" alt="" /></div>
      </div>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <h3 class="mb-4">Destaque para Locação</h3>
      <div class="carousel-locacao">
        <div><img src="https://source.unsplash.com/600x400/?rental" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?office" alt="" /></div>
        <div><img src="https://source.unsplash.com/600x400/?apartment" alt="" /></div>
      </div>
    </div>
  </section>

  <section class="horario-funcionamento text-center text-white py-3">
    <p class="mb-0">Horário de Funcionamento: Seg a Sex - 9h às 18h | Sáb - 9h às 13h</p>
  </section>

  <footer class="footer text-center text-white py-3">
    <p class="mb-0">&copy; 2025 Minha Imobiliária - Todos os direitos reservados</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

  <script src="js/script.js"></script>
</body>
</html>
