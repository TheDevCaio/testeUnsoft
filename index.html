<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Unsoft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

    <link rel="stylesheet" href="css/style.css">

<body>

    <header class="bg-light shadow-sm">

                    <li class="nav-item"><a href="#" class="nav-link">Locação</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="banner position-relative text-white text-center">
        <div class="banner-overlay"></div>
        <div class="container position-relative py-5">
            <h2>Encontre o imóvel dos seus sonhos</h2>
            <form class="row g-2 justify-content-center mt-4">
                <div class="col-12 col-md-3">
                    <input type="text" class="form-control" placeholder="Cidade">
                </div>
                <div class="col-12 col-md-3">
                    <input type="text" class="form-control" placeholder="Tipo de imóvel">
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-primary w-100">Buscar</button>
                </div>
            </form>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h3 class="mb-4">Super Destaque</h3>
            <div class="carousel-super">
                <div><img src="https://source.unsplash.com/600x400/?luxury-house" alt="Super Destaque"></div>
                <div><img src="https://source.unsplash.com/600x400/?modern-house" alt="Super Destaque"></div>
                <div><img src="https://source.unsplash.com/600x400/?apartment" alt="Super Destaque"></div>
            </div>
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container">
            <h3 class="mb-4">Destaque para Venda</h3>
            <div class="carousel-venda">
                <div><img src="https://source.unsplash.com/600x400/?house" alt="Venda"></div>
                <div><img src="https://source.unsplash.com/600x400/?apartment" alt="Venda"></div>
                <div><img src="https://source.unsplash.com/600x400/?real-estate" alt="Venda"></div>
            </div>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h3 class="mb-4">Destaque para Locação</h3>
            <div class="carousel-locacao">
                <div><img src="https://source.unsplash.com/600x400/?rental" alt="Locação"></div>
                <div><img src="https://source.unsplash.com/600x400/?office" alt="Locação"></div>
                <div><img src="https://source.unsplash.com/600x400/?apartment" alt="Locação"></div>
            </div>
        </div>
    </section>

    <section class="bg-dark text-white py-4 text-center">
        <p class="mb-0">Horário de Funcionamento: Seg a Sex - 9h às 18h | Sáb - 9h às 13h</p>
    </section>

    <footer class="bg-secondary text-white text-center py-3">
        <p class="mb-0">&copy; 2025 Minha Imobiliária - Todos os direitos reservados</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
